<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SmartCart | Admin Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: -apple-system, BlinkMacSystemFont,
                         "Segoe UI", Arial, sans-serif;

            background:
                linear-gradient(135deg,
                    #667eea,
                    #764ba2,
                    #4f46e5);
        }

        .card {
            width: 100%;
            max-width: 430px;

            padding: 35px 28px;

            background: rgba(255,255,255,.95);

            border-radius: 30px;

            box-shadow: 0 25px 60px rgba(0,0,0,.25);
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: auto;
            margin-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 21px;

            font-size: 35px;

            background:
                linear-gradient(135deg,#a855f7,#667eea);

            box-shadow:
                0 10px 25px rgba(124,58,237,.30);
        }

        h1 {
            text-align: center;
            font-size: 29px;
            color: #111827;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin: 7px 0 27px;
        }

        .flash {
            padding: 12px;
            border-radius: 13px;
            margin-bottom: 15px;

            background: #fee2e2;
            color: #991b1b;

            text-align: center;
            font-size: 13px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #374151;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 53px;

            padding: 0 15px;

            border: 1px solid #e5e7eb;
            border-radius: 15px;

            background: #f9fafb;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #8b5cf6;
            background: white;

            box-shadow:
                0 0 0 4px rgba(139,92,246,.12);
        }

        button {
            width: 100%;
            min-height: 54px;

            border: 0;
            border-radius: 16px;

            background:
                linear-gradient(135deg,#a855f7,#667eea);

            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(124,58,237,.30);
        }

        button:active {
            transform: scale(.97);
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        a {
            display: block;

            min-height: 44px;
            padding-top: 10px;

            text-decoration: none;

            color: #4f46e5;
            font-size: 14px;
            font-weight: 700;
        }

        .back {
            color: #6b7280;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">👨‍💼</div>

    <h1>Admin Registration</h1>

    <p class="subtitle">
        Create your SmartCart administrator account
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/admin-signup">

        <div class="field">
            <label>Full Name</label>

            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   required>
        </div>

        <div class="field">
            <label>Email Address</label>

            <input type="email"
                   name="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <button type="submit">
            📩 &nbsp; Send OTP
        </button>

    </form>

    <div class="links">

        <a href="/admin-login">
            Already registered? Login
        </a>

        <a href="/" class="back">
            ← Back to SmartCart
        </a>

    </div>

</div>

</body>
</html>
