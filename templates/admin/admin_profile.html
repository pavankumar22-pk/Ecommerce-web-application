<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SmartCart | Admin Profile</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f6fb;

            color: #111827;
        }

        .header {
            padding: 22px 18px 75px;

            background:
                linear-gradient(135deg,#667eea,#764ba2);

            color: white;

            border-radius:
                0 0 35px 35px;
        }

        .header-inner {
            max-width: 700px;
            margin: auto;
        }

        .back {
            color: white;
            text-decoration: none;

            min-height: 44px;

            display: inline-flex;
            align-items: center;

            font-size: 14px;
        }

        .header h1 {
            margin-top: 10px;
            font-size: 30px;
        }

        .content {
            max-width: 700px;

            margin: -55px auto 30px;

            padding: 0 16px;
        }

        .card {
            background: white;

            border-radius: 28px;

            padding: 28px;

            box-shadow:
                0 18px 40px rgba(0,0,0,.12);
        }

        .profile-image {
            width: 110px;
            height: 110px;

            margin: -80px auto 18px;

            border-radius: 50%;

            border: 5px solid white;

            background: #eef2ff;

            object-fit: cover;

            display: block;

            box-shadow:
                0 10px 25px rgba(0,0,0,.15);
        }

        .no-image {
            width: 110px;
            height: 110px;

            margin: -80px auto 18px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(135deg,#667eea,#764ba2);

            border: 5px solid white;

            font-size: 42px;

            box-shadow:
                0 10px 25px rgba(0,0,0,.15);
        }

        .flash {
            padding: 12px;

            border-radius: 13px;

            background: #dcfce7;
            color: #166534;

            margin-bottom: 18px;

            text-align: center;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            color: #374151;

            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;

            height: 52px;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 0 14px;

            background: #f9fafb;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            background: white;

            border-color: #667eea;

            box-shadow:
                0 0 0 4px rgba(102,126,234,.10);
        }

        input[type="file"] {
            height: auto;
            padding: 13px;
        }

        .btn {
            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(135deg,#667eea,#764ba2);

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;
        }

        .btn:active {
            transform: scale(.97);
        }

        @media(max-width:500px) {
            .card {
                padding: 22px 18px;
            }
        }

    </style>

</head>

<body>


<div class="header">

    <div class="header-inner">

        <a href="/admin-dashboard" class="back">
            ← Dashboard
        </a>

        <h1>👤 Admin Profile</h1>

    </div>

</div>


<div class="content">

    <div class="card">


        {% if admin.profile_image %}

            <img
                class="profile-image"
                src="/static/uploads/admin_profiles/{{ admin.profile_image }}"
                alt="Admin Profile"
            >

        {% else %}

            <div class="no-image">
                👤
            </div>

        {% endif %}


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST"
              action="/admin/profile"
              enctype="multipart/form-data">


            <div class="field">

                <label>Name</label>

                <input type="text"
                       name="name"
                       value="{{ admin.name }}"
                       required>

            </div>


            <div class="field">

                <label>Email</label>

                <input type="email"
                       name="email"
                       value="{{ admin.email }}"
                       required>

            </div>


            <div class="field">

                <label>New Password</label>

                <input type="password"
                       name="password"
                       placeholder="Leave empty to keep current password">

            </div>


            <div class="field">

                <label>Profile Image</label>

                <input type="file"
                       name="profile_image"
                       accept="image/*">

            </div>


            <button type="submit"
                    class="btn">
                ✓ &nbsp; Update Profile
            </button>

        </form>

    </div>

</div>

</body>
</html>
