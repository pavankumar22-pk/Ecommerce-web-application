<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SmartCart | Product Details</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(135deg,#eef2ff,#f5f3ff);

            color: #111827;
        }

        .header {
            padding: 22px 18px 30px;

            background:
                linear-gradient(135deg,#667eea,#764ba2);

            color: white;

            border-radius:
                0 0 28px 28px;
        }

        .header-inner {
            max-width: 850px;
            margin: auto;
        }

        .back {
            color: white;

            text-decoration: none;

            min-height: 44px;

            display: inline-flex;
            align-items: center;

            font-size: 14px;

            margin-bottom: 14px;
        }

        h1 {
            font-size: 29px;
        }

        .content {
            max-width: 850px;

            margin: -15px auto 30px;

            padding: 0 16px;
        }

        .card {
            background: white;

            border-radius: 28px;

            overflow: hidden;

            box-shadow:
                0 18px 40px rgba(0,0,0,.10);
        }

        .image {
            height: 350px;

            padding: 25px;

            background: #f3f4f6;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .details {
            padding: 25px;
        }

        .badge {
            display: inline-block;

            padding: 7px 11px;

            border-radius: 20px;

            background: #eef2ff;
            color: #4f46e5;

            font-size: 12px;
            font-weight: 700;

            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;

            margin-bottom: 12px;
        }

        .description {
            color: #6b7280;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 18px;
        }

        .price {
            font-size: 28px;

            font-weight: 900;

            color: #4f46e5;

            margin-bottom: 22px;
        }

        .actions {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 10px;
        }

        .btn {
            min-height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 14px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 800;
        }

        .edit {
            color: white;

            background:
                linear-gradient(135deg,#a855f7,#7c3aed);
        }

        .back-btn {
            color: #4338ca;

            background: #eef2ff;
        }

        @media(max-width:550px) {

            .image {
                height: 280px;
            }

            .details {
                padding: 20px;
            }

            h2 {
                font-size: 24px;
            }

            .actions {
                grid-template-columns: 1fr;
            }
        }

    </style>

</head>

<body>


<div class="header">

    <div class="header-inner">

        <a href="/admin/item-list" class="back">
            ← Product List
        </a>

        <h1>📦 Product Details</h1>

    </div>

</div>


<div class="content">

    <div class="card">

        <div class="image">

            <img
                src="/static/uploads/product_images/{{ product.image }}"
                alt="{{ product.name }}"
            >

        </div>


        <div class="details">

            <div class="badge">
                {{ product.category }}
            </div>

            <h2>
                {{ product.name }}
            </h2>

            <p class="description">
                {{ product.description }}
            </p>

            <div class="price">
                ₹{{ product.price }}
            </div>


            <div class="actions">

                <a href="/admin/update-item/{{ product.product_id }}"
                   class="btn edit">
                    ✏️ Edit Product
                </a>

                <a href="/admin/item-list"
                   class="btn back-btn">
                    ← Back to Products
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
