<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SmartCart | Verify OTP</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(135deg,
                    #667eea,
                    #764ba2,
                    #4f46e5);
        }

        .card {
            width: 100%;
            max-width: 420px;

            padding: 36px 28px;

            border-radius: 30px;

            background: rgba(255,255,255,.95);

            box-shadow:
                0 25px 60px rgba(0,0,0,.25);
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: auto;
            margin-bottom: 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            font-size: 34px;

            background:
                linear-gradient(135deg,#667eea,#764ba2);
        }

        h1 {
            text-align: center;
            color: #111827;
            font-size: 29px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin: 7px 0 25px;
        }

        .flash {
            padding: 12px;
            border-radius: 13px;
            background: #fee2e2;
            color: #991b1b;

            text-align: center;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-size: 13px;
            font-weight: 700;
            color: #374151;
        }

        input {
            width: 100%;
            height: 53px;

            border: 1px solid #e5e7eb;
            border-radius: 15px;

            padding: 0 15px;

            background: #f9fafb;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
            background: white;

            box-shadow:
                0 0 0 4px rgba(102,126,234,.12);
        }

        button {
            width: 100%;
            min-height: 54px;

            border: none;
            border-radius: 16px;

            background:
                linear-gradient(135deg,#667eea,#764ba2);

            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;
        }

        button:active {
            transform: scale(.97);
        }
    </style>

</head>

<body>

<div class="card">

    <div class="icon">🔐</div>

    <h1>Verify OTP</h1>

    <p class="subtitle">
        Verify your email and create a password
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="/verify-otp">

        <div class="field">

            <label>Enter OTP</label>

            <input type="text"
                   name="otp"
                   inputmode="numeric"
                   maxlength="6"
                   placeholder="6-digit OTP"
                   required>

        </div>

        <div class="field">

            <label>Create Password</label>

            <input type="password"
                   name="password"
                   placeholder="Create password"
                   required>

        </div>

        <button type="submit">
            ✓ &nbsp; Verify & Register
        </button>

    </form>

</div>

</body>
</html>
