<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SmartCart | Delivery Address</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                linear-gradient(135deg,#667eea,#764ba2);

            color: #111827;
        }

        .card {
            width: 100%;
            max-width: 480px;

            padding: 30px 25px;

            border-radius: 30px;

            background: rgba(255,255,255,.95);

            box-shadow:
                0 25px 60px rgba(0,0,0,.23);
        }

        .icon {
            width: 68px;
            height: 68px;

            margin: auto auto 16px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 21px;

            font-size: 34px;

            background:
                linear-gradient(135deg,#667eea,#764ba2);
        }

        h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            font-size: 13px;

            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;

            color: #374151;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            background: #f9fafb;

            padding: 13px 14px;

            font-family: inherit;

            font-size: 16px;

            outline: none;
        }

        input {
            height: 52px;
        }

        textarea {
            min-height: 100px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {
            background: white;

            border-color: #667eea;

            box-shadow:
                0 0 0 4px rgba(102,126,234,.10);
        }

        .save {
            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(135deg,#667eea,#764ba2);

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 5px;

            box-shadow:
                0 10px 25px rgba(79,70,229,.28);
        }

        .save:active {
            transform: scale(.97);
        }

        .back {
            display: block;

            text-align: center;

            color: #6b7280;

            text-decoration: none;

            min-height: 44px;

            padding-top: 13px;

            font-size: 13px;
        }

        @media(max-width:450px) {

            .card {
                padding: 25px 19px;

                border-radius: 25px;
            }

        }

    </style>

</head>

<body>


<div class="card">


    <div class="icon">
        📍
    </div>


    <h1>
        Delivery Address
    </h1>


    <p class="subtitle">
        Where should we deliver your order?
    </p>


    <form action="/user/save-address"
          method="POST">


        <div class="field">

            <label>
                Full Name
            </label>

            <input type="text"
                   name="name"
                   placeholder="Enter full name"
                   required>

        </div>


        <div class="field">

            <label>
                Phone Number
            </label>

            <input type="tel"
                   name="phone"
                   inputmode="tel"
                   placeholder="Enter phone number"
                   required>

        </div>


        <div class="field">

            <label>
                Address
            </label>

            <textarea name="address"
                      placeholder="House number, street, area..."
                      required></textarea>

        </div>


        <div class="field">

            <label>
                City
            </label>

            <input type="text"
                   name="city"
                   placeholder="Enter city"
                   required>

        </div>


        <div class="field">

            <label>
                Pincode
            </label>

            <input type="text"
                   name="pincode"
                   inputmode="numeric"
                   maxlength="6"
                   placeholder="Enter pincode"
                   required>

        </div>


        <button type="submit"
                class="save">
            📍 &nbsp; Save Address
        </button>


    </form>


    <a href="/user/products"
       class="back">
        ← Back to Shopping
    </a>


</div>

</body>
</html>
