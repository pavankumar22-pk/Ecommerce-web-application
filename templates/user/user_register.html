<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SmartCart | Register</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2,
                    #4f46e5
                );

            -webkit-tap-highlight-color: transparent;
        }


        .register-card {

            width: 100%;

            max-width: 420px;

            padding: 32px 25px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.94);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.22);
        }


        .logo {

            width: 65px;

            height: 65px;

            margin: 0 auto 15px;

            border-radius: 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            background:
                linear-gradient(
                    135deg,
                    #a855f7,
                    #667eea
                );

            box-shadow:
                0 10px 25px rgba(124,58,237,0.3);
        }


        h1 {

            text-align: center;

            font-size: 29px;

            color: #111827;

            margin-bottom: 5px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 25px;
        }


        .flash {

            padding: 12px;

            border-radius: 12px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 13px;

            text-align: center;

            margin-bottom: 15px;
        }


        .field {

            margin-bottom: 16px;
        }


        label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #374151;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            height: 52px;

            border-radius: 15px;

            border: 1px solid #e5e7eb;

            background: #f9fafb;

            padding: 0 15px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #8b5cf6;

            background: white;

            box-shadow:
                0 0 0 4px rgba(139,92,246,0.12);
        }


        .register-btn {

            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #a855f7,
                    #667eea
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            margin-top: 5px;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(124,58,237,0.3);

            touch-action: manipulation;
        }


        .register-btn:active {

            transform: scale(0.97);
        }


        .login-link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #4f46e5;

            text-decoration: none;

            font-weight: 700;

            font-size: 14px;

            min-height: 44px;

            padding-top: 12px;
        }


        .back {

            display: block;

            text-align: center;

            color: #6b7280;

            text-decoration: none;

            font-size: 13px;

            min-height: 44px;

            padding-top: 10px;
        }

    </style>

</head>


<body>


<div class="register-card">


    <div class="logo">
        🛒
    </div>


    <h1>
        Create Account
    </h1>


    <div class="subtitle">
        Join SmartCart today
    </div>


    <!-- FLASH -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="flash">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="/user-register"
    >


        <div class="field">

            <label>
                Full Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <div class="field">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="field">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

        </div>


        <button
            type="submit"
            class="register-btn"
        >
            ✨ &nbsp; Create Account
        </button>


    </form>


    <a
        href="/user-login"
        class="login-link"
    >
        Already have an account? Login
    </a>


    <a
        href="/"
        class="back"
    >
        ← Back to SmartCart
    </a>


</div>


</body>
</html>
