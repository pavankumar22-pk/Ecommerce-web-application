<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SmartCart | Login</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2,
                    #4f46e5
                );

            -webkit-tap-highlight-color: transparent;
        }


        .login-card {

            width: 100%;

            max-width: 410px;

            padding: 35px 25px;

            border-radius: 30px;

            background:
                rgba(255,255,255,0.92);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.22);

        }


        .logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 18px;

            border-radius: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            box-shadow:
                0 10px 25px rgba(79,70,229,0.3);
        }


        h1 {

            text-align: center;

            font-size: 30px;

            color: #111827;

            margin-bottom: 5px;
        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 28px;
        }


        .flash {

            padding: 12px;

            border-radius: 12px;

            background: #fee2e2;

            color: #991b1b;

            font-size: 13px;

            margin-bottom: 15px;

            text-align: center;
        }


        .field {

            margin-bottom: 18px;
        }


        label {

            display: block;

            font-size: 13px;

            font-weight: 700;

            color: #374151;

            margin-bottom: 7px;
        }


        input {

            width: 100%;

            height: 52px;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 0 15px;

            font-size: 16px;

            outline: none;

            background: #f9fafb;

            transition: 0.2s;
        }


        input:focus {

            border-color: #667eea;

            background: white;

            box-shadow:
                0 0 0 4px rgba(102,126,234,0.12);
        }


        .login-btn {

            width: 100%;

            min-height: 54px;

            border: none;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #667eea,
                    #764ba2
                );

            color: white;

            font-size: 16px;

            font-weight: 800;

            cursor: pointer;

            margin-top: 5px;

            box-shadow:
                0 10px 25px rgba(79,70,229,0.3);

            touch-action: manipulation;
        }


        .login-btn:active {

            transform: scale(0.97);
        }


        .register {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #4f46e5;

            text-decoration: none;

            font-size: 14px;

            font-weight: 700;

            min-height: 44px;

            padding-top: 12px;
        }


        .back {

            display: block;

            text-align: center;

            color: #6b7280;

            text-decoration: none;

            font-size: 13px;

            margin-top: 5px;

            min-height: 44px;

            padding-top: 12px;
        }

    </style>

</head>


<body>


<div class="login-card">


    <div class="logo">
        🛒
    </div>


    <h1>
        Welcome Back
    </h1>


    <div class="subtitle">
        Login to your SmartCart account
    </div>


    <!-- FLASH -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="flash">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form
        method="POST"
        action="/user-login"
    >


        <div class="field">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="field">

            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

        </div>


        <button
            type="submit"
            class="login-btn"
        >
            🔐 &nbsp; Login
        </button>


    </form>


    <a
        href="/user-register"
        class="register"
    >
        Don't have an account? Create Account
    </a>


    <a
        href="/"
        class="back"
    >
        ← Back to SmartCart
    </a>


</div>


</body>
</html>
